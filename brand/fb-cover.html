<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1640px; height: 624px; overflow: hidden; }
  body {
    position: relative;
    background-color: #fafaf8;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #1f2937;
  }

  /* ── tło: miękkie plamy akcentu + delikatna siatka ───────────── */
  .blob-right {
    position: absolute;
    width: 900px; height: 900px;
    right: -220px; top: -320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(134,103,81,0.11), rgba(134,103,81,0) 65%);
  }
  .blob-left {
    position: absolute;
    width: 700px; height: 700px;
    left: -260px; bottom: -420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(174,144,112,0.10), rgba(174,144,112,0) 65%);
  }
  .watermark {
    position: absolute;
    right: 40px; bottom: -220px;
    width: 760px; height: 760px;
    color: rgba(134,103,81,0.07);
  }
  .hairline-top { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #866751, #ae9070, #d4c5ae); }

  /* ── lewa kolumna ────────────────────────────────────────────── */
  .content {
    position: absolute;
    left: 200px; top: 0; bottom: 0;
    width: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(148deg, #93725a, #6d5445);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(134,103,81,0.30);
  }
  .logo-mark svg { width: 30px; height: 30px; color: #fff; }
  .logo-text { display: flex; flex-direction: column; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.01em; line-height: 1; color: #1f2937; }
  .logo-tag { margin-top: 5px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #9ca3af; }

  h1 {
    margin-top: 34px;
    font-family: 'DM Serif Display', serif;
    font-weight: 400;
    font-size: 64px;
    letter-spacing: -0.01em;
    line-height: 1.0;
  }
  h1 .line1 { display: block; color: #1f2937; }
  h1 .line2 {
    display: block;
    margin-top: 4px;
    background: linear-gradient(90deg, #866751, #ae9070 55%, #a17e60);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 6px; /* zapas na dolne wydłużenia przy clipie */
  }
  .sub {
    margin-top: 18px;
    max-width: 600px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 19px;
    line-height: 1.5;
    color: #6b7280;
  }
  .sub strong { color: #1f2937; font-weight: 600; }

  .stats {
    margin-top: 36px;
    display: flex;
    align-items: flex-start;
    gap: 44px;
  }
  .stat { position: relative; padding-left: 0; }
  .stat + .stat { padding-left: 44px; border-left: 1px solid #e5e5e0; }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1; color: #866751; }
  .stat-num small { font-size: 20px; }
  .stat-label { margin-top: 7px; font-size: 13px; font-weight: 500; color: #6b7280; }

  /* ── prawa strona: kolaż zdjęć ───────────────────────────────── */
  .collage { position: absolute; right: 0; top: 0; bottom: 0; width: 660px; }
  .card {
    position: absolute;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #e5e5e0;
    background: #fff;
    box-shadow: 0 24px 60px rgba(47,36,30,0.16);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-back  { width: 300px; height: 452px; left: 30px;  top: 86px;  transform: rotate(-3deg); }
  .card-front { width: 296px; height: 392px; left: 296px; top: 128px; transform: rotate(2deg); box-shadow: 0 30px 70px rgba(47,36,30,0.20); }

  .chip {
    position: absolute;
    left: 236px; top: 62px;
    display: flex; align-items: center; gap: 9px;
    padding: 12px 20px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid #e5e5e0;
    box-shadow: 0 10px 30px rgba(47,36,30,0.12);
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #1f2937;
    transform: rotate(-1deg);
    z-index: 3;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #866751; }

  .chip2 {
    position: absolute;
    left: 96px; bottom: 44px;
    padding: 14px 22px;
    border-radius: 14px;
    background: linear-gradient(148deg, #93725a, #6d5445);
    box-shadow: 0 14px 34px rgba(109,84,69,0.35);
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    transform: rotate(-2deg);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="hairline-top"></div>
  <div class="blob-right"></div>
  <div class="blob-left"></div>
  <svg class="watermark" viewBox="0 0 100 100" fill="none">
    <rect x="20" y="20" width="60" height="60" stroke="currentColor" stroke-width="2.6"/>
    <path d="M42 12H88V56" stroke="currentColor" stroke-width="2.6"/>
    <path d="M12 44V88H58" stroke="currentColor" stroke-width="2.6"/>
    <path d="M36 68V33L50 64L64 33V68" stroke="currentColor" stroke-width="4"/>
  </svg>

  <div class="content">
    <div class="logo-row">
      <div class="logo-mark">
        <svg viewBox="0 0 100 100" fill="none">
          <rect x="20" y="20" width="60" height="60" stroke="currentColor" stroke-width="4"/>
          <path d="M42 12H88V56" stroke="currentColor" stroke-width="4"/>
          <path d="M12 44V88H58" stroke="currentColor" stroke-width="4"/>
          <path d="M36 68V33L50 64L64 33V68" stroke="currentColor" stroke-width="5.5"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-name">Mekra.pl</div>
        <div class="logo-tag">Fronty ramiakowe</div>
      </div>
    </div>

    <h1>
      <span class="line1">Charakter wnętrza</span>
      <span class="line2">zaczyna się od frontu</span>
    </h1>

    <p class="sub">
      Fronty ramiakowe z&nbsp;płyty laminowanej, matowej i&nbsp;akrylowej
      na&nbsp;wymiar — <strong>producent, Toruń</strong>.
    </p>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">4</div>
        <div class="stat-label">rodzaje ramek</div>
      </div>
      <div class="stat">
        <div class="stat-num">21<small>&nbsp;mm</small></div>
        <div class="stat-label">grubość frontu</div>
      </div>
      <div class="stat">
        <div class="stat-num">100%</div>
        <div class="stat-label">przetestowane</div>
      </div>
    </div>
  </div>

  <div class="collage">
    <div class="card card-back"><img src="file:///D:/mekra.pl/public/img/ramka77mm-900.webp" alt=""></div>
    <div class="card card-front"><img src="file:///D:/mekra.pl/public/img/ramka36mm-900.webp" alt=""></div>
    <div class="chip"><span class="dot"></span>Producent frontów</div>
    <div class="chip2">mekra.pl</div>
  </div>
</body>
</html>
